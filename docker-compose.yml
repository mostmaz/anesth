# Production stack.
#
# Caddy is the only service published to the internet. It terminates HTTPS
# (certificate obtained and renewed automatically) and forwards /api and
# /uploads to the API and everything else to the web app. The API and the
# database are reachable only from this machine.
#
# The droplet is too small to build images, so code is built on a workstation
# and synced here (see scripts/deploy.sh): the API runs the compiled code in
# ./server/dist with the schema in ./server/prisma, and the web app is served
# from ./client/dist. All three are mounted read-only over what the images contain.
#
# Required in .env (same directory): JWT_SECRET, SITE_HOST, CORS_ORIGINS.

services:
  db:
    image: postgres:15-alpine
    container_name: icu_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: icu_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: anesth-server
    container_name: icu_server_prod
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/icu_db?schema=public
      - PORT=3001
      # No fallback on purpose: the stack refuses to start without a real secret.
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      - CORS_ORIGINS=${CORS_ORIGINS:?Set CORS_ORIGINS in .env, e.g. https://203-0-113-10.sslip.io}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - FIREBASE_SERVICE_ACCOUNT_B64=${FIREBASE_SERVICE_ACCOUNT_B64:-}
      - LAB_USER=${LAB_USER:-}
      - LAB_PASSWORD=${LAB_PASSWORD:-}
      - CHECKPOINT_DISABLE=1
      # Optional. An ISO date: accounts whose password is older must choose a new one at sign-in.
      - REQUIRE_PASSWORD_CHANGE_BEFORE=${REQUIRE_PASSWORD_CHANGE_BEFORE:-}
    # The database client is regenerated from the synced schema at every start,
    # so a schema change needs no new image.
    command: ["sh", "-c", "npx prisma generate && exec node dist/index.js"]
    # Chromium (lab import) runs inside this container; the cap keeps a memory
    # spike from taking the whole droplet down. The container restarts instead.
    mem_limit: 750m
    ports:
      # Local access only (debugging over SSH). The public route is Caddy.
      - "127.0.0.1:3001:3001"
    volumes:
      - uploads_data:/app/uploads
      - ./server/dist:/app/dist:ro
      - ./server/prisma:/app/prisma:ro
    depends_on:
      - db

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    image: anesth-client
    container_name: icu_client_prod
    restart: always
    volumes:
      - ./client/dist:/usr/share/nginx/html:ro
    depends_on:
      - server

  caddy:
    image: caddy:2-alpine
    container_name: icu_caddy_prod
    restart: always
    environment:
      - SITE_HOST=${SITE_HOST:?Set SITE_HOST in .env, e.g. 203-0-113-10.sslip.io}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
      - client

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
